<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Марафон ЕГЭ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--bg:#0a0b0e;--surface:#121319;--surface-2:#181a22;--surface-3:#20232c;--surface-hover:#1c1f28;--border:#262932;--border-soft:#1b1d25;--border-strong:#353945;--text:#e8e9ec;--text-mute:#9499a6;--text-dim:#5d6270;--text-faint:#404552;--accent:#f3e7a1;--russian:#e9a8c9;--russian-soft:#2a1822;--math:#f0c674;--math-soft:#2a2014;--informatics:#84d4a2;--informatics-soft:#15261c;--success:#66d19e;--warn:#f0b86e;--danger:#ec7878;--info:#7eb8e8;--radius:10px;--radius-lg:14px;--fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,monospace}
html.light{--bg:#faf9f4;--surface:#fff;--surface-2:#f5f4ee;--surface-3:#ecebe3;--surface-hover:#f0efe7;--border:#e0ded3;--border-soft:#ebe9df;--border-strong:#c8c5b8;--text:#1a1b1f;--text-mute:#5b5f6b;--text-dim:#8c8f99;--text-faint:#b8bac3;--accent:#735c0d;--russian:#b54375;--russian-soft:#fae3ee;--math:#a06e15;--math-soft:#fbeed3;--informatics:#2a8c54;--informatics-soft:#dbf2e3}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;margin:0;color:var(--text)}
h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
.auth-screen{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 30% 20%,rgba(243,231,161,.04),transparent 50%),radial-gradient(circle at 70% 80%,rgba(132,212,162,.03),transparent 50%)}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:36px 32px}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.auth-mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#1a1206;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:22px}
.auth-title{font-family:var(--fd);font-size:22px;font-weight:600}
.auth-sub{color:var(--text-dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.auth-tabs{display:flex;gap:4px;margin:24px 0 18px;border-bottom:1px solid var(--border-soft)}
.auth-tab{flex:1;padding:12px;background:transparent;border:none;color:var(--text-mute);font-weight:500;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form input{padding:11px 14px;font-size:14px}
.auth-err{color:var(--danger);font-size:13px;padding:10px 14px;background:rgba(236,120,120,.08);border:1px solid rgba(236,120,120,.25);border-radius:8px}
.auth-err[hidden]{display:none}
.auth-submit{padding:12px;background:var(--accent);color:#1a1206;border:none;border-radius:8px;font-weight:600;font-size:14px;margin-top:6px}
.auth-submit:disabled{opacity:.5;cursor:wait}
.auth-hint{color:var(--text-dim);font-size:12px;line-height:1.6;margin-top:8px}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.app[hidden]{display:none}
.sidebar{background:var(--surface);border-right:1px solid var(--border-soft);padding:22px 18px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#1a1206;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:18px}
.brand-name{font-family:var(--fd);font-weight:600;font-size:16px}
.brand-sub{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase}
.countdown{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin:4px 0 14px}
.countdown-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.countdown-num{font-family:var(--fd);font-size:30px;font-weight:600;line-height:1.1;margin-top:2px;color:var(--accent)}
.countdown-unit{font-size:12px;color:var(--text-mute);margin-top:2px}
.nav-section{padding:12px 8px 4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--text-mute);font-size:13.5px;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--surface-3);color:var(--text)}
.nav-item .ti{font-size:18px;opacity:.85}
.nav-dot{width:6px;height:6px;border-radius:50%;margin-left:auto}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft)}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;margin-bottom:8px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#1a1206;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.user-name-s{font-size:13px;font-weight:500;line-height:1.2}
.user-handle{font-size:11px;color:var(--text-dim);font-family:var(--fm)}
.sidebar-actions{display:flex;gap:6px}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;color:var(--text-mute);flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border-soft);background:var(--bg);position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:baseline;gap:14px;min-width:0}
.topbar-title{font-family:var(--fd);font-size:18px;font-weight:600}
.topbar-crumb{font-size:12px;color:var(--text-dim)}
.topbar-right{display:flex;align-items:center;gap:10px}
.date-pill{font-family:var(--fm);font-size:12px;color:var(--text-mute);padding:6px 12px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:999px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:500}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.btn-primary:hover{background:#fbe88a}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-mute)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:rgba(236,120,120,.08);border-color:rgba(236,120,120,.3)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn .ti{font-size:16px}
.view{display:none;padding:28px 32px 48px;max-width:1400px}
.view.active{display:block}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.view-head h1{display:flex;align-items:center;gap:12px}
.subtitle{color:var(--text-mute);font-size:13.5px;margin-top:6px;max-width:580px;line-height:1.55}
.view-actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px}
.stat-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.stat-value{font-family:var(--fd);font-size:26px;font-weight:600;margin-top:6px;line-height:1}
.stat-foot{font-size:12px;color:var(--text-mute);margin-top:6px}
.stat-bar{height:4px;background:var(--surface-3);border-radius:2px;margin-top:10px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px}
.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.card-title{font-family:var(--fd);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-title .ti{color:var(--text-dim);font-size:18px}
.card-meta{font-size:12px;color:var(--text-dim);font-family:var(--fm)}
.event-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:12px;border-left:4px solid var(--text-dim);overflow:hidden}
.event-card.russian{border-left-color:var(--russian)}
.event-card.math{border-left-color:var(--math)}
.event-card.informatics{border-left-color:var(--informatics)}
.event-top{display:grid;grid-template-columns:90px 1fr auto;gap:14px;padding:14px 18px;align-items:center;cursor:pointer}
.event-top:hover{background:var(--surface-3)}
.event-time{font-family:var(--fm);font-size:12px;color:var(--text-mute);line-height:1.3}
.event-time-main{font-size:16px;color:var(--text);font-weight:500}
.event-info{min-width:0}
.event-title-big{font-size:15px;font-weight:500;margin-top:6px}
.event-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.event-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;background:var(--surface-3)}
.event-tag.russian{color:var(--russian);background:var(--russian-soft)}
.event-tag.math{color:var(--math);background:var(--math-soft)}
.event-tag.informatics{color:var(--informatics);background:var(--informatics-soft)}
.event-status{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-mute)}
.event-status.done{color:var(--success);background:rgba(102,209,158,.1)}
.event-status.confirmed{color:var(--info);background:rgba(126,184,232,.1)}
.event-status.missed{color:var(--danger);background:rgba(236,120,120,.1)}
.event-edit{background:transparent;border:none;color:var(--text-dim);padding:6px;border-radius:6px}
.event-edit:hover{background:var(--surface-3);color:var(--text)}
.event-body{padding:14px 18px 16px;display:grid;gap:14px;border-top:1px solid var(--border-soft)}
.event-block-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;font-weight:500}
.event-task-list,.event-problem-list,.event-mock-list{display:grid;gap:6px}
.event-task-item{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border-soft)}
.event-task-num{font-family:var(--fm);font-size:13px;color:var(--text-mute);font-weight:500;padding-top:1px}
.event-task-name{font-size:14px;color:var(--text);font-weight:500}
.event-task-methods{font-size:12px;color:var(--text-dim);margin-top:3px}
.event-problem-item{padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border-soft);font-size:14px}
.event-problem-item.solved{color:var(--text-dim);text-decoration:line-through}
.event-mock-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border-soft);font-size:13px;gap:10px;flex-wrap:wrap}
.event-mock-score{font-family:var(--fm);font-weight:500}
.event-note{padding:12px 14px;background:var(--surface);border-radius:8px;border:1px solid var(--border-soft);font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.empty-state{padding:28px 20px;text-align:center;color:var(--text-dim);font-size:13px}
.empty-state .ti{font-size:32px;display:block;margin-bottom:8px;opacity:.5}
.cal-wrap{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-soft)}
.cal-month{font-family:var(--fd);font-size:18px;font-weight:600;text-transform:capitalize}
.cal-controls{display:flex;gap:4px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 0;border-bottom:1px solid var(--border-soft)}
.cal-weekday{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);padding:8px 0;font-weight:500}
.cal-weekday.weekend{color:var(--text-faint)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(96px,auto)}
.cal-cell{padding:8px 10px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);cursor:pointer;min-height:96px}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.dim{opacity:.35}
.cal-cell.today{background:var(--surface-2)}
.cal-cell.today .cal-day-num{color:var(--accent);font-weight:600}
.cal-cell.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cell.exam{background:rgba(243,231,161,.08)}
.cal-day-num{font-family:var(--fm);font-size:13px;color:var(--text-mute)}
.cal-events{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.cal-evt{font-size:10.5px;padding:2px 5px;border-radius:3px;background:var(--surface-3);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--text-dim)}
.cal-evt.russian{border-left-color:var(--russian);color:var(--russian)}
.cal-evt.math{border-left-color:var(--math);color:var(--math)}
.cal-evt.informatics{border-left-color:var(--informatics);color:var(--informatics)}
.cal-evt-more{font-size:10px;color:var(--text-dim);padding:0 5px}
.cal-exam-mark{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--accent);color:#1a1206;font-weight:600;margin-top:4px;display:inline-block}
.day-panel{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-top:16px}
.day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.subject-hero{display:grid;grid-template-columns:1fr auto;gap:24px;padding:28px 32px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);margin-bottom:20px;align-items:center}
.subject-hero h1{font-size:34px;margin-bottom:8px}
.subject-hero.russian h1{color:var(--russian)}
.subject-hero.math h1{color:var(--math)}
.subject-hero.informatics h1{color:var(--informatics)}
.subject-hero-sub{font-size:14px;color:var(--text-mute)}
.subject-hero-count{text-align:right}
.subject-hero-num{font-family:var(--fd);font-size:64px;font-weight:700;line-height:.95}
.subject-hero.russian .subject-hero-num{color:var(--russian)}
.subject-hero.math .subject-hero-num{color:var(--math)}
.subject-hero.informatics .subject-hero-num{color:var(--informatics)}
.subject-hero-unit{font-size:12px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.subj-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.subj-tab{padding:10px 16px;background:transparent;border:none;color:var(--text-mute);font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subj-tab.active.russian{color:var(--russian);border-bottom-color:var(--russian)}
.subj-tab.active.math{color:var(--math);border-bottom-color:var(--math)}
.subj-tab.active.informatics{color:var(--informatics);border-bottom-color:var(--informatics)}
.subj-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.subj-tab:hover{color:var(--text)}
.task-row{display:grid;grid-template-columns:56px 1fr auto;align-items:start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer}
.task-row:hover{background:var(--surface-2)}
.task-row:last-child{border-bottom:none}
.task-num{font-family:var(--fm);font-size:13px;color:var(--text-dim);padding-top:2px}
.task-num strong{color:var(--text);font-weight:500}
.task-content{min-width:0}
.task-title{font-size:14px;font-weight:500;margin-bottom:4px}
.task-meta{font-size:12px;color:var(--text-dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.method-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;background:var(--surface-3);color:var(--text-mute);border:1px solid var(--border-soft)}
.method-tag.mastered{color:var(--success);background:rgba(102,209,158,.08);border-color:rgba(102,209,158,.2)}
.method-tag .ti{font-size:12px}
.method-tag .rm{color:var(--text-faint);padding-left:4px}
.method-tag .rm:hover{color:var(--danger)}
.time-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;background:var(--surface-3);color:var(--text-mute);font-family:var(--fm)}
.status-pill{font-size:11px;padding:4px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.status-pill.todo{color:var(--text-mute);background:var(--surface-3)}
.status-pill.wip{color:var(--warn);background:rgba(240,184,110,.12)}
.status-pill.done{color:var(--success);background:rgba(102,209,158,.14)}
.task-expand{padding:4px 16px 20px 84px;background:var(--surface-2);border-bottom:1px solid var(--border-soft);display:none}
.task-expand.open{display:block}
.task-expand-row{margin-top:12px}
.task-expand-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;font-weight:500}
.method-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.method-add{display:flex;gap:6px;margin-top:8px}
.method-add input{flex:1}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
textarea{resize:vertical;min-height:64px;font-family:inherit}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-mute)}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.checklist{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--surface-2)}
.checklist label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:13px;flex-direction:row;color:var(--text)}
.checklist label:hover{background:var(--surface-3)}
.checklist input{width:auto}
.todo-section{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.todo-add-row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;margin-bottom:12px;align-items:center}
.todo-list{display:flex;flex-direction:column;gap:6px}
.todo-item{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;padding:12px 14px;border-radius:8px;align-items:center;background:var(--surface-2);border:1px solid var(--border-soft)}
.todo-text{font-size:14px}
.todo-text.done{color:var(--text-dim);text-decoration:line-through}
.todo-rm{background:transparent;border:none;color:var(--text-faint);padding:4px;border-radius:4px}
.todo-rm:hover{color:var(--danger)}
.checkbox{width:18px;height:18px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface);cursor:pointer;display:inline-grid;place-items:center;flex-shrink:0}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:#1a1206}
.checkbox.on::after{content:'✓';font-size:12px;font-weight:700}
.tasks-day{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.tasks-day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.tasks-day-date{font-family:var(--fd);font-size:15px;font-weight:600}
.tasks-day-date .wd{color:var(--text-mute);font-weight:500}
.tasks-day-stat{font-size:12px;color:var(--text-dim);font-family:var(--fm)}
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-bd{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px)}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-close{background:none;border:none;color:var(--text-mute);font-size:22px;width:28px;height:28px}
.modal-close:hover{color:var(--text)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:8px;padding:10px 16px;font-size:13px;z-index:200;animation:su .25s ease}
.toast.error{color:var(--danger);border-color:rgba(236,120,120,.4)}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.problem-item{padding:14px 16px;border-bottom:1px solid var(--border-soft);display:grid;gap:6px}
.problem-item:last-child{border-bottom:none}
.problem-text{font-size:14px}
.problem-text.done{color:var(--text-dim);text-decoration:line-through}
.row-meta{display:flex;gap:12px;font-size:11.5px;color:var(--text-dim);align-items:center;flex-wrap:wrap}
.row-actions{display:flex;gap:4px}
.row-actions button{background:transparent;border:none;color:var(--text-dim);padding:4px 6px;border-radius:4px}
.row-actions button:hover{background:var(--surface-3);color:var(--text)}
.mock-item{padding:16px;border-bottom:1px solid var(--border-soft)}
.mock-item:last-child{border-bottom:none}
.mock-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mock-score{font-family:var(--fm);font-weight:500;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;background:var(--surface-3);color:var(--text-mute)}
.chip.warn{color:var(--warn);background:rgba(240,184,110,.1)}
.chip.success{color:var(--success);background:rgba(102,209,158,.1)}
.chip.danger{color:var(--danger);background:rgba(236,120,120,.1)}
.score-bar{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-top:8px}
.score-fill{height:100%;border-radius:3px}
.progress-row{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;padding:10px 0}
.progress-row .label{font-size:13px;font-weight:500}
.progress-track{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px}
.progress-pct{font-family:var(--fm);font-size:12px;color:var(--text-mute);min-width:60px;text-align:right}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--text-mute);margin-bottom:10px;flex-wrap:wrap}
.legend-dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.leader{width:100%;border-collapse:collapse}
.leader th{text-align:left;padding:10px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;border-bottom:1px solid var(--border-soft)}
.leader td{padding:14px 12px;border-bottom:1px solid var(--border-soft);font-size:13.5px}
.leader tr:hover td{background:var(--surface-2);cursor:pointer}
.leader-rank{font-family:var(--fm);color:var(--text-dim);width:50px}
.leader-rank.gold{color:#f0c674;font-weight:600}
.leader-rank.silver{color:#c8c8d0;font-weight:600}
.leader-rank.bronze{color:#d09060;font-weight:600}
.leader-user{display:flex;align-items:center;gap:10px}
.leader-name{font-weight:500}
.leader-handle{font-size:11px;color:var(--text-dim);font-family:var(--fm)}
.leader-pct{font-family:var(--fm);font-weight:500}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.user-tile{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;cursor:pointer}
.user-tile:hover{background:var(--surface-2);border-color:var(--border-strong)}
.user-tile-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.user-tile-av{width:40px;height:40px;border-radius:50%;background:var(--surface-3);color:var(--text);display:grid;place-items:center;font-weight:600;font-size:15px}
.user-tile-bio{font-size:12px;color:var(--text-mute);line-height:1.5}
.user-tile-stats{display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft)}
.user-tile-stat{font-size:11px;color:var(--text-dim)}
.user-tile-stat strong{display:block;font-family:var(--fd);font-size:18px;font-weight:600;color:var(--text);margin-bottom:2px}
.profile-hero{display:flex;align-items:center;gap:18px;padding:20px 24px;background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);margin-bottom:20px;flex-wrap:wrap}
.profile-av{width:80px;height:80px;border-radius:50%;background:var(--accent);color:#1a1206;display:grid;place-items:center;font-weight:600;font-size:28px;font-family:var(--fd);flex-shrink:0}
.profile-name{font-family:var(--fd);font-size:26px;font-weight:600}
.profile-handle{font-family:var(--fm);font-size:13px;color:var(--text-mute);margin-top:2px}
.profile-bio{font-size:13.5px;color:var(--text-mute);margin-top:8px;max-width:480px;line-height:1.6}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:14px}.view{padding:18px}.cal-grid{grid-auto-rows:minmax(72px,auto)}.topbar{padding:14px 18px}.subject-hero{grid-template-columns:1fr;text-align:left}.subject-hero-count{text-align:left}.todo-add-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="auth-screen" id="auth-screen" hidden>
  <div class="auth-card">
    <div class="auth-brand"><div class="auth-mark">М</div><div><div class="auth-title">Марафон ЕГЭ</div><div class="auth-sub">личный план · соревнование · аналитика</div></div></div>
    <div class="auth-tabs"><button class="auth-tab active" data-mode="login">Войти</button><button class="auth-tab" data-mode="register">Регистрация</button></div>
    <form class="auth-form" id="auth-form" autocomplete="off">
      <label class="field" id="f-display" style="display:none">Как тебя называть<input type="text" id="i-display" placeholder="Виктор" maxlength="40"></label>
      <label class="field">Логин<input type="text" id="i-username" placeholder="латиница, цифры, _ — 3–20 символов" maxlength="20"></label>
      <label class="field">Пароль<input type="password" id="i-password" placeholder="минимум 6 символов" maxlength="100"></label>
      <div class="auth-err" id="auth-err" hidden></div>
      <button type="submit" class="auth-submit" id="auth-submit">Войти</button>
      <div class="auth-hint">После 5 неудачных попыток за сутки аккаунт временно блокируется. С одного адреса не более 20 попыток в час.</div>
    </form>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">М</div><div><div class="brand-name">Марафон ЕГЭ</div><div class="brand-sub">2026</div></div></div>
    <div class="countdown"><div class="countdown-label" id="cd-label">До ближайшего экзамена</div><div class="countdown-num" id="cd-num">—</div><div class="countdown-unit" id="cd-unit">дней</div></div>
    <div class="nav-section">Обзор</div>
    <button class="nav-item active" data-view="today"><i class="ti ti-sun"></i> Сегодня</button>
    <button class="nav-item" data-view="calendar"><i class="ti ti-calendar"></i> Календарь</button>
    <button class="nav-item" data-view="tasks"><i class="ti ti-checklist"></i> Задачи</button>
    <div class="nav-section">Предметы</div>
    <button class="nav-item" data-view="russian"><i class="ti ti-book"></i> Русский <span class="nav-dot" style="background:var(--russian)"></span></button>
    <button class="nav-item" data-view="math"><i class="ti ti-math-symbols"></i> Математика <span class="nav-dot" style="background:var(--math)"></span></button>
    <button class="nav-item" data-view="informatics"><i class="ti ti-code"></i> Информатика <span class="nav-dot" style="background:var(--informatics)"></span></button>
    <div class="nav-section">Подготовка</div>
    <button class="nav-item" data-view="mocks"><i class="ti ti-chart-line"></i> Пробники</button>
    <button class="nav-item" data-view="problems"><i class="ti ti-alert-triangle"></i> Проблемы</button>
    <button class="nav-item" data-view="goals"><i class="ti ti-target"></i> Цели</button>
    <div class="nav-section">Сообщество</div>
    <button class="nav-item" data-view="community"><i class="ti ti-users"></i> Топ-лист</button>
    <div class="nav-section">Аккаунт</div>
    <button class="nav-item" data-view="profile"><i class="ti ti-user"></i> Профиль</button>
    <button class="nav-item" data-view="admin"><i class="ti ti-settings"></i> Настройки</button>
    <div class="sidebar-foot">
      <div class="user-card"><div class="user-avatar" id="ua">?</div><div style="min-width:0;flex:1"><div class="user-name-s" id="un">—</div><div class="user-handle" id="uh">—</div></div></div>
      <div class="sidebar-actions"><button class="icon-btn" id="theme-btn" title="Тема"><i class="ti ti-sun-moon"></i></button><button class="icon-btn" id="logout-btn" title="Выйти"><i class="ti ti-logout"></i></button></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-left"><span class="topbar-crumb" id="crumb">Обзор</span><span class="topbar-title" id="ttitle">Сегодня</span></div>
      <div class="topbar-right"><span class="date-pill" id="date-pill"></span><button class="btn btn-primary" id="qa"><i class="ti ti-plus"></i> Событие</button></div>
    </header>
    <section class="view active" id="view-today"></section>
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-russian"></section>
    <section class="view" id="view-math"></section>
    <section class="view" id="view-informatics"></section>
    <section class="view" id="view-mocks"></section>
    <section class="view" id="view-problems"></section>
    <section class="view" id="view-goals"></section>
    <section class="view" id="view-community"></section>
    <section class="view" id="view-user"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-admin"></section>
  </main>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-bd" data-close></div>
  <div class="modal-card"><div class="modal-head"><h3 id="modal-title">…</h3><button class="modal-close" data-close>×</button></div><div class="modal-body" id="modal-body"></div></div>
</div>
<script src="/app.js"></script>
</body>
</html>
